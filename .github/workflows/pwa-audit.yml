name: Campos Pass PWA Audit

on:
  push:
    paths:
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'pwa-register.js'
      - 'index.html'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'icon-512-maskable.png'
      - '.github/workflows/pwa-audit.yml'
  pull_request:
    paths:
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'pwa-register.js'
      - 'index.html'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'icon-512-maskable.png'
      - '.github/workflows/pwa-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PWA files
        run: |
          test -s manifest.webmanifest
          test -s sw.js
          test -s pwa-register.js
          test -s icon-192.png
          test -s icon-512.png
          test -s icon-512-maskable.png
          grep -q '"display": "standalone"' manifest.webmanifest
          grep -q 'icon-192.png' manifest.webmanifest
          grep -q 'icon-512.png' manifest.webmanifest
          grep -q 'maskable' manifest.webmanifest
          grep -q 'rel="manifest"' index.html
          grep -q 'theme-color' index.html
          grep -q 'name="viewport"' index.html
          grep -q 'name="mobile-web-app-capable" content="yes"' index.html
          grep -q 'name="apple-mobile-web-app-capable" content="yes"' index.html
          grep -q 'serviceWorker' pwa-register.js
          grep -q 'beforeinstallprompt' pwa-register.js
          grep -q "updateViaCache: 'none'" pwa-register.js
          grep -q 'visibilitychange' pwa-register.js
      - name: Validate safe cache policy
        run: |
          grep -qi "authorization" sw.js
          grep -qi "cookie" sw.js
          grep -qi "if-range" sw.js
          grep -qi "content-range" sw.js
          grep -qi "status === 206" sw.js
          grep -Eq "key === ['\"]range['\"]" sw.js
          grep -Eq "key === ['\"]if-range['\"]" sw.js
          grep -q "key.startsWith(CACHE_PREFIX)" sw.js
      - name: Validate service worker version alignment
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          sw = Path('sw.js').read_text(encoding='utf-8')
          register = Path('pwa-register.js').read_text(encoding='utf-8')

          cache_match = re.search(r"CACHE_NAME\s*=\s*`\$\{CACHE_PREFIX\}(v[^`]+)`", sw)
          register_match = re.search(r"sw\.js\?([^'\"\s]+)", register)

          assert cache_match, 'CACHE_NAME version not found in sw.js'
          assert register_match, 'registered service worker version not found in pwa-register.js'

          cache_version = cache_match.group(1)
          registered_version = register_match.group(1)
          assert registered_version == cache_version, (
              f'service worker version mismatch: register={registered_version} cache={cache_version}'
          )
          PY
