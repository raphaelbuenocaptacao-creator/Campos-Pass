name: Integrate PWA

on:
  push:
    paths:
      - '.github/workflows/pwa-integrate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch PWA integration safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          original=s
          head='''    <meta name="theme-color" content="#0f1f3a" />\n    <meta name="mobile-web-app-capable" content="yes" />\n    <meta name="apple-mobile-web-app-capable" content="yes" />\n    <meta name="apple-mobile-web-app-status-bar-style" content="default" />\n    <meta name="apple-mobile-web-app-title" content="Campos Pass" />\n    <link rel="manifest" href="./manifest.webmanifest" />\n    <link rel="icon" href="./icon-192.svg" />\n    <link rel="apple-touch-icon" href="./icon-192.svg" />\n'''
          if 'rel="manifest"' not in s:
              s=s.replace('</head>', head+'\n</head>', 1)
          if './pwa-register.js' not in s:
              s=s.replace('</body>', '    <script src="./pwa-register.js" defer></script>\n</body>', 1)
          if s!=original:
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate integration
        run: |
          grep -q 'rel="manifest" href="./manifest.webmanifest"' index.html
          grep -q './pwa-register.js' index.html
          grep -q 'theme-color' index.html
          grep -q '"display": "standalone"' manifest.webmanifest
          grep -q 'icon-192' manifest.webmanifest
          grep -q 'icon-512' manifest.webmanifest
          grep -q 'maskable' manifest.webmanifest
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Finaliza integração PWA do Campos Pass'
          git push
